name: Doctor Discussion Agenda

on:
  # Pre-compute weekly discussion agendas at Sunday 03:00 SGT (19:00 UTC)
  schedule:
    - cron: "0 19 * * 0"
  # Also triggerable manually for ad-hoc runs
  workflow_dispatch:

jobs:
  discussion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger discussion-agenda computation
        run: |
          STATUS=$(curl -s --max-time 290 -o /tmp/result.json -w "%{http_code}" \
            -X POST "${{ secrets.ASSESS_BASE_URL }}/api/cron/discussion-agenda" \
            -H "X-Assessment-Key: ${{ secrets.ASSESSMENT_API_KEY }}")

          cat /tmp/result.json
          echo ""

          if [ "$STATUS" -eq 200 ]; then
            echo "Discussion agenda computation completed successfully."
            exit 0
          else
            echo "HTTP $STATUS — discussion agenda computation failed."
            exit 1
          fi
