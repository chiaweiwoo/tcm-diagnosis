name: Analytics Daily Cron

on:
  schedule:
    # 02:00 CST = 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch: {}

jobs:
  run-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger analytics cron endpoint
        run: |
          STATUS=$(curl -s -o /tmp/body.json -w "%{http_code}" \
            -X POST "${{ secrets.ASSESS_BASE_URL }}/api/cron/analytics-daily" \
            -H "X-Assessment-Key: ${{ secrets.ASSESSMENT_API_KEY }}" \
            -H "Content-Type: application/json")
          cat /tmp/body.json
          if [ "$STATUS" -ne 200 ]; then
            echo "Analytics cron failed with HTTP $STATUS"
            exit 1
          fi

      - name: Trigger doctor evaluations (Goal 1+2)
        run: |
          STATUS=$(curl -s -o /tmp/eval-body.json -w "%{http_code}" \
            -X POST "${{ secrets.ASSESS_BASE_URL }}/api/cron/evaluate-doctors" \
            -H "X-Assessment-Key: ${{ secrets.ASSESSMENT_API_KEY }}" \
            -H "Content-Type: application/json")
          cat /tmp/eval-body.json
          if [ "$STATUS" -ne 200 ]; then
            echo "Doctor evaluations cron failed with HTTP $STATUS"
            exit 1
          fi
