name: Assess

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Assessment mode"
        required: true
        default: "normal"
        type: choice
        options:
          - normal
          - smart

jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run assessment
        id: run
        env:
          ASSESS_BASE_URL: ${{ secrets.ASSESS_BASE_URL }}
          ASSESSMENT_API_KEY: ${{ secrets.ASSESSMENT_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          OUTPUT=$(node scripts/assess-run.mjs --mode ${{ inputs.mode }})
          echo "$OUTPUT"
          RUN_ID=$(echo "$OUTPUT" | grep -oP 'run_id=\K\S+')
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      - name: Review assessment
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/assess-review.mjs
