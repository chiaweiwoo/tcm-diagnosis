name: dr_discussion

on:
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:

jobs:
  dr_discussion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger dr_discussion computation
        run: |
          ROUTE="${{ secrets.ASSESS_BASE_URL }}/api/cron/dr_discussion"
          echo "Route: $ROUTE"

          STATUS=$(curl -s --max-time 290 -o /tmp/result.json -w "%{http_code}" \
            -X POST "$ROUTE" \
            -H "X-Assessment-Key: ${{ secrets.ASSESSMENT_API_KEY }}")

          echo "HTTP status: $STATUS"
          echo "Response body:"
          cat /tmp/result.json
          echo

          if [ "$STATUS" -eq 200 ]; then
            echo "dr_discussion completed successfully."
            exit 0
          else
            echo "dr_discussion failed."
            exit 1
          fi
