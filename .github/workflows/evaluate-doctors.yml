name: Evaluate Doctors

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Doctor email — leave blank to evaluate all active doctors"
        required: false
        default: ""
      force:
        description: "Force re-evaluation even if already evaluated today"
        type: boolean
        default: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger evaluation
        run: |
          BODY=$(jq -cn \
            --arg email "${{ github.event.inputs.email }}" \
            --argjson force "${{ github.event.inputs.force }}" \
            '{doctorEmail: (if $email != "" then $email else null end), force: $force}
             | if .doctorEmail == null then del(.doctorEmail) else . end')

          STATUS=$(curl -s -o /tmp/result.json -w "%{http_code}" \
            -X POST "${{ secrets.VERCEL_PRODUCTION_URL }}/api/cron/evaluate-doctors" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          cat /tmp/result.json
          echo ""
          if [ "$STATUS" -ne 200 ]; then
            echo "Evaluation failed with HTTP $STATUS"
            exit 1
          fi
