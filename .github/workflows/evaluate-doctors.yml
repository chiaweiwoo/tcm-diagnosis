name: Evaluate Doctors

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Doctor email — leave blank to evaluate all active doctors"
        required: false
        default: ""
      force:
        description: "Force re-evaluation even if already evaluated today"
        type: boolean
        default: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      INPUT_EMAIL: ${{ github.event.inputs.email }}
      INPUT_FORCE: ${{ github.event.inputs.force }}
    steps:
      - name: Trigger evaluation
        run: |
          # Build JSON body without jq
          if [ -n "$INPUT_EMAIL" ] && [ "$INPUT_FORCE" = "true" ]; then
            BODY="{\"doctorEmail\":\"$INPUT_EMAIL\",\"force\":true}"
          elif [ -n "$INPUT_EMAIL" ]; then
            BODY="{\"doctorEmail\":\"$INPUT_EMAIL\"}"
          elif [ "$INPUT_FORCE" = "true" ]; then
            BODY="{\"force\":true}"
          else
            BODY="{}"
          fi

          echo "Posting to $PROD_URL/api/cron/evaluate-doctors"
          echo "Body: $BODY"

          STATUS=$(curl -s -o /tmp/result.json -w "%{http_code}" \
            -X POST "$PROD_URL/api/cron/evaluate-doctors" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          cat /tmp/result.json
          echo ""
          if [ "$STATUS" -ne 200 ]; then
            echo "Evaluation failed with HTTP $STATUS"
            exit 1
          fi
