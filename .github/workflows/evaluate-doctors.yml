name: Evaluate Doctors

on:
  workflow_dispatch:
    inputs:
      doctor_email:
        description: "Doctor email to evaluate. Doctor reviews are run per-doctor."
        required: true
        type: string
      doctor_id:
        description: "Optional doctor UUID (takes precedence over email if specified)."
        required: false
        type: string
      force:
        description: "Accepted for CLI compatibility. Goal 2 storage is append-only."
        required: false
        default: true
        type: boolean
      window_days:
        description: "Evaluation window in days."
        required: false
        default: "7"
        type: string

jobs:
  evaluate-doctors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Trigger Goal 2 doctor evaluation (Process Runner)
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ASSESSMENT_API_KEY: ${{ secrets.ASSESSMENT_API_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
          DOCTOR_EMAIL: ${{ inputs.doctor_email }}
          DOCTOR_ID: ${{ inputs.doctor_id }}
          WINDOW_DAYS: ${{ inputs.window_days }}
        run: |
          npx tsx scripts/evaluate-local.ts --email "$DOCTOR_EMAIL" --doctorId "$DOCTOR_ID" --windowDays "$WINDOW_DAYS"
