name: Evaluate Doctors

on:
  schedule:
    - cron: "0 18 * * *"  # 02:00 CST (UTC+8)
  workflow_dispatch:
    inputs:
      email:
        description: "Doctor email — leave blank to evaluate all active doctors"
        required: false
        default: ""
      force:
        description: "Force re-evaluation even if already evaluated today"
        type: boolean
        default: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger evaluation
        run: |
          EMAIL="${{ github.event.inputs.email }}"
          FORCE="${{ github.event.inputs.force }}"

          if [ -n "$EMAIL" ] && [ "$FORCE" = "true" ]; then
            BODY="{\"doctorEmail\":\"$EMAIL\",\"force\":true}"
          elif [ -n "$EMAIL" ]; then
            BODY="{\"doctorEmail\":\"$EMAIL\"}"
          elif [ "$FORCE" = "true" ]; then
            BODY="{\"force\":true}"
          else
            BODY="{}"
          fi

          STATUS=$(curl -s -o /tmp/result.json -w "%{http_code}" \
            -X POST "${{ secrets.ASSESS_BASE_URL }}/api/cron/evaluate-doctors" \
            -H "X-Assessment-Key: ${{ secrets.ASSESSMENT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          cat /tmp/result.json
          echo ""
          if [ "$STATUS" -ne 200 ]; then
            echo "Evaluation failed with HTTP $STATUS"
            exit 1
          fi
