name: Update AI provider rates

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  update-rates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch and update rates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/update-rates.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/rates.json
          if git diff --cached --quiet; then
            echo "No rate changes — skipping commit."
          else
            git commit -m "chore: update AI provider rates [skip ci]"
            git push
          fi
