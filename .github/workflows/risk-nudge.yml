name: Doctor Risk Nudge

on:
  # First scheduled workflow in this project — daily at 03:00 SGT (19:00 UTC)
  schedule:
    - cron: "0 19 * * *"
  # Also triggerable manually for ad-hoc runs
  workflow_dispatch:

jobs:
  nudge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger risk-nudge computation
        run: |
          STATUS=$(curl -s --max-time 290 -o /tmp/result.json -w "%{http_code}" \
            -X POST "${{ secrets.ASSESS_BASE_URL }}/api/cron/risk-nudge" \
            -H "X-Assessment-Key: ${{ secrets.ASSESSMENT_API_KEY }}")

          cat /tmp/result.json
          echo ""

          if [ "$STATUS" -eq 200 ]; then
            echo "Risk nudge computation completed successfully."
            exit 0
          else
            echo "HTTP $STATUS — risk nudge computation failed."
            exit 1
          fi
